<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Regressão do filtro Volátil</title>
<body>
<pre id="resultado">Executando…</pre>
<script>
(async () => {
    const out = document.getElementById('resultado');
    const assert = (cond, msg) => { if (!cond) throw Error(msg); };
    try {
        // Executa a função real do aplicativo, isolada para não iniciar login nem alterar dados.
        const origem = await (await fetch('../script.js')).text();
        const inicio = origem.indexOf('const atualizarVolatilPorNome = async (nome, volatil) => {');
        const fim = origem.indexOf('\n};', inicio);
        assert(inicio >= 0 && fim > inicio, 'função de atualização não encontrada');
        const codigo = origem.slice(inicio, fim + 3);
        let chamadas = 0;
        const fetchSimulado = async (url, opcoes) => {
            chamadas++;
            const filtro = new URL(url).searchParams.get('nome');
            const nome = filtro?.slice(3);
            assert(filtro?.startsWith('eq.'), 'operador de igualdade ausente');
            assert(opcoes.method === 'PATCH', 'método incorreto');
            assert(opcoes.headers.Prefer === 'return=representation', 'retorno de IDs ausente');
            assert(JSON.parse(opcoes.body).volatil === false, 'flag incorreta');
            return { ok: true, json: async () => nome === esperado
                ? [{ id: 1, nome, volatil: false }, { id: 2, nome, volatil: false }]
                : [] };
        };
        const atualizar = new Function('fetch', 'API', 'KEY', 'tokenAtual',
            codigo + '\nreturn atualizarVolatilPorNome;')(
                fetchSimulado, 'https://exemplo.invalid', 'chave-ficticia', async () => 'token-ficticio');
        let esperado;
        for (const nome of ['Faturamento PJ', 'Água, luz (casa)', 'Quote: " e barra \\', 'Volátil']) {
            esperado = nome;
            const linhas = await atualizar(nome, false);
            assert(linhas.length === 2 && linhas.every(x => x.nome === nome),
                'o filtro não selecionou exatamente o grupo: ' + nome);
        }
        assert(chamadas === 4, 'número de chamadas incorreto');
        out.textContent = 'PASSOU: 4 nomes e retorno de 2 IDs por grupo';
        document.documentElement.dataset.resultado = 'passou';
    } catch (erro) {
        out.textContent = 'FALHOU: ' + erro.message;
        document.documentElement.dataset.resultado = 'falhou';
    }
})();
</script>
</body>
</html>
