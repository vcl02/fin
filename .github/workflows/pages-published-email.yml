name: Notificar publicação do GitHub Pages

on:
  deployment_status:

permissions:
  contents: read

jobs:
  email:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages'
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      DEPLOY_NOTIFY_EMAIL: ${{ vars.DEPLOY_NOTIFY_EMAIL }}
      PAGE_URL: ${{ github.event.deployment_status.environment_url }}
      DEPLOY_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Avisar configuração pendente
        if: env.RESEND_API_KEY == '' || env.RESEND_FROM_EMAIL == '' || env.DEPLOY_NOTIFY_EMAIL == ''
        run: |
          echo "::notice::Notificação de publicação não enviada. Configure RESEND_API_KEY, RESEND_FROM_EMAIL e DEPLOY_NOTIFY_EMAIL no repositório."

      - name: Enviar e-mail
        if: env.RESEND_API_KEY != '' && env.RESEND_FROM_EMAIL != '' && env.DEPLOY_NOTIFY_EMAIL != ''
        run: |
          body=$(jq -n \
            --arg from "$RESEND_FROM_EMAIL" \
            --arg to "$DEPLOY_NOTIFY_EMAIL" \
            --arg url "$PAGE_URL" \
            --arg sha "$DEPLOY_SHA" \
            '{
              from: $from,
              to: [$to],
              subject: "Fin publicado com sucesso",
              html: ("<p>O Fin foi publicado com sucesso.</p><p><a href=\"" + $url + "\">Abrir site</a></p><p>Commit: <code>" + $sha + "</code></p>")
            }')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.resend.com/emails \
            --header "Authorization: Bearer $RESEND_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$body"
