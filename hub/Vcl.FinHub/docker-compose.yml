# Banco descartável e isolado do Fin Hub para desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    container_name: finhub-postgres-local
    environment:
      POSTGRES_DB: finhub
      POSTGRES_USER: finhub
      POSTGRES_PASSWORD: finhub-local-only
    ports:
      # Porta alternativa evita colisão com uma eventual instalação local do PostgreSQL.
      - "127.0.0.1:54329:5432"
    volumes:
      - finhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finhub -d finhub"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  # Dados locais persistem entre reinicializações, mas nunca saem desta máquina.
  finhub-postgres-data:
